# Release builds, run by .github/workflows/release.yml when a v* tag is pushed.
# Check locally with: goreleaser release --snapshot --clean
version: 2

project_name: soroforge

before:
  hooks:
    - go mod tidy

builds:
  - id: soroforge
    main: ./cmd/soroforge
    binary: soroforge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

# One SPDX SBOM per archive (<archive>.sbom.json), generated by Syft, which the
# release workflow installs. SBOMs are listed in checksums.txt too.
sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt

# Multi-arch image on GHCR, built from the binaries above (see Dockerfile.release)
# rather than recompiled, so the image and the archives cannot disagree.
# Pre-releases get their version tag but never move :latest.
dockers_v2:
  - id: soroforge
    ids: [soroforge]
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/soroworks/soroforge
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Deployment and lifecycle management for Stellar/Soroban smart contracts"
      org.opencontainers.image.source: "https://github.com/soroworks/soroforge"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: Apache-2.0

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
