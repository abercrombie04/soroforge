# Default values for soroforge.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: soroforge
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Static environment variable settings.
env:
  SOROFORGE_LOG_FORMAT: "json"
  SOROFORGE_API_ADDR: "0.0.0.0:8080"

# Additional arbitrary environment variables.
extraEnv: []

# Secrets configuration.
# SoroForge refuses to run without required credentials.
# Secrets are NEVER defined in values directly — configure existing Secret references.
secrets:
  # Name of an existing Kubernetes Secret containing all credentials.
  # If set, individual secretName fields below default to this name.
  existingSecret: ""

  databaseUrl:
    secretName: ""
    key: "DATABASE_URL"

  signingKey:
    secretName: ""
    key: "SOROFORGE_SECRET_KEY"

  # Single read-write bearer token.
  apiToken:
    secretName: ""
    key: "SOROFORGE_API_TOKEN"

  # Scoped bearer tokens (e.g. "dashboard:read:...,ci:write:...").
  apiTokens:
    secretName: ""
    key: "SOROFORGE_API_TOKENS"

# Project configuration (soroforge.yaml).
# Supplied via a ConfigMap.
config:
  # Reference an existing ConfigMap instead of creating one.
  existingConfigMap: ""

  # YAML content for soroforge.yaml in the managed ConfigMap.
  yaml: |
    version: 1
    default_network: testnet
    networks:
      testnet:
        rpc_url: https://soroban-testnet.stellar.org
        passphrase: "Test SDF Network ; September 2015"
    contracts: {}

# Pre-install and pre-upgrade database migration hook.
migration:
  enabled: true
  hookDeletePolicy: "before-hook-creation,hook-succeeded"
  resources: {}
