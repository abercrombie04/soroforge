# GoReleaser creates the GitHub release, so this is the one workflow that needs
# contents: write. The job repeats that scope; nothing else is granted.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Push the release image to ghcr.io with the built-in GITHUB_TOKEN; no
  # long-lived registry credentials.
  packages: write
  # Build-provenance attestations: a Sigstore certificate bound to this
  # workflow run (id-token), stored with the repository's attestations.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The same Postgres CI uses, so the store suite runs before a release
    # rather than skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soroforge
          POSTGRES_PASSWORD: soroforge
          POSTGRES_DB: soroforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soroforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from history since the last tag.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          # Always the newest patch release: security fixes land there.
          check-latest: true

      # A release must not ship code that fails its own suite.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://soroforge:soroforge@localhost:5432/soroforge?sslmode=disable
        run: go test ./...

      # GoReleaser builds the multi-arch image with buildx; QEMU lets the
      # amd64 runner build the arm64 variant.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser shells out to Syft for the per-archive SBOMs.
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Link every release file to this workflow run, so users can check with
      # `gh attestation verify` that it was built here from the tagged commit.
      # checksums.txt lists the archives and their SBOMs.
      - name: Attest release archives and SBOMs
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ./dist/checksums.txt

      # The bare binaries too, so a binary already extracted from its archive
      # can still be verified.
      - name: Attest binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "./dist/soroforge_*/soroforge*"
